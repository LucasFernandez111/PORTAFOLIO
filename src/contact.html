<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
  </head>
  <body
    class="min-h-screen font-sans text-gray-100 text-lg font-semibold bg-gradient-to-tr from-[#0a122a] via-[#162a52] to-[#1f3a72]"
  >
    <!-- Botón flotante para volver -->
    <div
      data-aos="fade-up"
      class="fixed top-6 left-6 z-50 w-12 h-12 rounded-full bg-slate-900/80 text-white flex items-center justify-center shadow-lg backdrop-blur-md cursor-pointer hover:bg-slate-800 transition-all duration-300"
      onclick="window.history.back()"
      title="Volver"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        class="w-6 h-6"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M15 19l-7-7 7-7"
        />
      </svg>
    </div>
    <!-- Botón flotante para maps -->
    <div
      data-aos="fade-up"
      class="fixed top-6 right-6 z-50 w-12 h-12 rounded-full bg-slate-900/80 text-white flex items-center justify-center shadow-lg backdrop-blur-md cursor-pointer hover:bg-slate-800 transition-all duration-300"
      onclick="redirectMaps()"
      title="Volver"
    >
   <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
  <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
  <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
</svg>

    </div>
    <section
      data-aos="fade-up"
      class="flex justify-center items-center w-full py-16 px-4"
    >
      <div
        class="w-full max-w-2xl flex flex-col gap-6 backdrop-blur-sm bg-slate-900/60 p-8 rounded-xl shadow-xl"
      >
        <!-- Información de contacto -->
        <div class="text-start text-white space-y-2">
          <div class="flex items-center gap-2">
            <div class="w-5 h-5">
              <svg
                role="img"
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
              >
                <title>Gmail</title>
                <path
                  d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z"
                  fill="white"
                />
              </svg>
            </div>
            <p class="text-sm">flucasyoel@outlook.es</p>
          </div>

          <div class="flex items-center gap-2">
            <img
              src="../assets/github-mark-white.png"
              alt="GitHub"
              class="w-5 h-5"
            />
            <p class="text-sm m-0">github.com/</p>
          </div>

          <div class="flex items-center gap-2">
            <img src="../assets/linkedin.png" alt="LinkedIn" class="w-5 h-5" />
            <p class="text-sm m-0">linkedin.com/in/lucas-fernandez-b32304280</p>
          </div>
        </div>

        <form
          action="https://formspree.io/f/mqabqyka"
          method="POST"
          class="grid grid-cols-1 md:grid-cols-12 gap-4 w-full"
        >
          <input
            type="text"
            name="name"
            placeholder="Nombre"
            required
            class="md:col-span-6 w-full px-4 py-2 rounded-md bg-white/10 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
          <input
            type="email"
            name="email"
            placeholder="Email"
            required
            class="md:col-span-6 w-full px-4 py-2 rounded-md bg-white/10 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
          <textarea
            name="message"
            placeholder="Mensaje"
            required
            class="md:col-span-12 w-full h-32 px-4 py-2 rounded-md bg-white/10 text-white placeholder-gray-400 resize-none focus:outline-none focus:ring-2 focus:ring-blue-500"
          ></textarea>

          <!-- Campo honeypot -->
          <input type="text" name="_honey" style="display: none" />

          <!-- Desactiva captcha -->
          <input type="hidden" name="_captcha" value="false" />

          <!-- Redirección después del envío -->
          <input
            type="hidden"
            name="_redirect"
            value="https://tusitio.com/gracias"
          />

          <!-- Botón de enviar -->
          <button
            type="submit"
            class="md:col-span-12 w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-md transition-all duration-300"
          >
            Enviar
          </button>
        </form>
      </div>
    </section>

    <section
      data-aos="fade-up"
      class="flex justify-center items-center w-full py-6 px-4"
      onclick="redirectWhatsapp()"
    >
      <a
        href="https://wa.me/549XXXXXXXXXX"
        target="_blank"
        rel="noopener noreferrer"
        class="w-full max-w-2xl flex flex-row gap-6 items-center backdrop-blur-sm bg-slate-900/60 p-8 rounded-xl shadow-xl hover:bg-slate-900/70 hover:scale-[1.02] hover:shadow-2xl transition-all duration-700 ease-in-out cursor-pointer text-white"
      >
       <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="50" height="50" viewBox="0,0,256,256"
style="fill:#FFFFFF;">
<g fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="none" font-weight="none" font-size="none" text-anchor="none" style="mix-blend-mode: normal"><g transform="scale(8.53333,8.53333)"><path d="M15,3c-6.627,0 -12,5.373 -12,12c0,2.25121 0.63234,4.35007 1.71094,6.15039l-1.60352,5.84961l5.97461,-1.56836c1.74732,0.99342 3.76446,1.56836 5.91797,1.56836c6.627,0 12,-5.373 12,-12c0,-6.627 -5.373,-12 -12,-12zM10.89258,9.40234c0.195,0 0.39536,-0.00119 0.56836,0.00781c0.214,0.005 0.44692,0.02067 0.66992,0.51367c0.265,0.586 0.84202,2.05608 0.91602,2.20508c0.074,0.149 0.12644,0.32453 0.02344,0.51953c-0.098,0.2 -0.14897,0.32105 -0.29297,0.49805c-0.149,0.172 -0.31227,0.38563 -0.44727,0.51563c-0.149,0.149 -0.30286,0.31238 -0.13086,0.60938c0.172,0.297 0.76934,1.27064 1.65234,2.05664c1.135,1.014 2.09263,1.32561 2.39063,1.47461c0.298,0.149 0.47058,0.12578 0.64258,-0.07422c0.177,-0.195 0.74336,-0.86411 0.94336,-1.16211c0.195,-0.298 0.39406,-0.24644 0.66406,-0.14844c0.274,0.098 1.7352,0.8178 2.0332,0.9668c0.298,0.149 0.49336,0.22275 0.56836,0.34375c0.077,0.125 0.07708,0.72006 -0.16992,1.41406c-0.247,0.693 -1.45991,1.36316 -2.00391,1.41016c-0.549,0.051 -1.06136,0.24677 -3.56836,-0.74023c-3.024,-1.191 -4.93108,-4.28828 -5.08008,-4.48828c-0.149,-0.195 -1.21094,-1.61031 -1.21094,-3.07031c0,-1.465 0.76811,-2.18247 1.03711,-2.48047c0.274,-0.298 0.59492,-0.37109 0.79492,-0.37109z"></path></g></g>
</svg>
        <h2 class="text-lg font-semibold">
          Enviame un WhatsApp para contactarme.
        </h2>
      </a>
    </section>
    <footer
      class="w-full bg-slate-900/60 backdrop-blur-sm text-white py-6 mt-12"
    >
      <div
        class="max-w-6xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4"
      >
        <!-- Nombre o marca -->
        <div class="text-center md:text-left">
          <p class="text-lg font-semibold">Lucas Fernandez</p>
          <p class="text-sm text-gray-400">
            Desarrollador Web • Buenos Aires, Argentina
          </p>
        </div>

        <!-- Copyright -->
        <div class="text-sm text-gray-500 text-center md:text-right">
          &copy; 2025 Lucas Fernandez. Todos los derechos reservados.
        </div>
      </div>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
      function redirectMaps() {
        window.location.href = "./map.html";
      }

      function redirectWhatsapp() {
        window.location.href =
          "https://api.whatsapp.com/send/?phone=1130773485&text=Hola!%21&type=phone_number&app_absent=0";
      }
      AOS.init({
        duration: 600,
        once: true,
        easing: "ease-in-out",
      });
    </script>
  </body>
</html>
